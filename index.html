<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#70c5ce">
<title>Flappy Bird</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-wrap">
<canvas id="game" width="480" height="800" aria-label="Flappy Bird"></canvas>
<div class="controls">
<button id="restart" hidden>Jogar novamente</button>
<button id="menu" hidden>Menu</button>
<button id="debug">Debug: OFF</button>
</div>
<p class="hint">Toque na tela ou pressione Espaço para voar.</p>
</main>
<script src="game.js"></script>
</body>
</html>
